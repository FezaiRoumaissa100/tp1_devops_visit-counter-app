services:
  web:
    build: .
    image: counter-app:1.0
    ports:
      - "${WEB_PORT}:${APP_PORT}"
    environment:
      REDIS_HOST: db-service
    depends_on:
      - db-service
    networks:
      - app-network

  db-service:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    name: app-network

volumes:
  redis-data:
    name: redis-data
